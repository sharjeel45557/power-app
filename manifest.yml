# Cloud Foundry deployment manifest.
#
# Deploy with:  cf push
#
# Prerequisites (see docs/deployment-cloudfoundry.md):
#   1. A bound Postgres service instance (name it `power-app-db`).
#   2. Auth + session config supplied via env or a user-provided service.
#   3. The app must be built first:  pnpm install && pnpm build
#
# The Node.js buildpack runs `npm start`, which boots the API host. The host
# serves both the JSON API and the pre-built React SPA (apps/web/dist).
applications:
  - name: power-app
    memory: 512M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    # Only ship what the runtime needs; build artifacts are produced before push.
    command: pnpm --filter @power-app/server start
    health-check-type: http
    health-check-http-endpoint: /healthz
    env:
      NODE_ENV: production
      AUTH_MODE: entra
      OPTIMIZE_MEMORY: "true"
    services:
      - power-app-db
